<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>News Intelligence Dashboard</title>
	<meta name="description" content="AI-curated news on the NFL, the stock market and weather, ranked by relevance.">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M8 22V10h3l6 8v-8h3v12h-3l-6-8v8z' fill='white'/%3E%3C/svg%3E">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header class="topbar">
		<div class="wrap topbar-inner">
			<div class="brand">
				<h1>News Intelligence</h1>
				<p class="tagline">NFL, stock market and weather, ranked by relevance</p>
			</div>
			<div class="refresh-block">
				<button id="refresh" class="btn-primary" type="button">
					<span class="spinner" aria-hidden="true"></span>
					<span id="refresh-label">Refresh</span>
				</button>
				<p id="last-refreshed" class="meta" aria-live="polite">Loading…</p>
			</div>
		</div>
	</header>

	<main class="wrap">
		<form id="filters" class="filters" aria-label="Filter articles">
			<label>
				<span>Topic</span>
				<select id="topic">
					<option value="">All topics</option>
					<option value="nfl">NFL</option>
					<option value="stock_market">Stock market</option>
					<option value="weather">Weather</option>
				</select>
			</label>
			<label>
				<span>Minimum relevance</span>
				<select id="min-score">
					<option value="">Any (1+)</option>
					<option value="3">3+</option>
					<option value="5">5+</option>
					<option value="7">7+</option>
					<option value="9">9+</option>
				</select>
			</label>
			<label>
				<span>Articles to show</span>
				<select id="limit">
					<option value="10">10</option>
					<option value="25">25</option>
					<option value="50" selected>50</option>
					<option value="100">100</option>
				</select>
			</label>
		</form>

		<div id="banner" class="banner" role="status" hidden></div>
		<div id="content" aria-busy="true"></div>
	</main>

	<footer class="wrap footer">
		<p>Summaries and scores are generated by Claude from web search results. Always check the original source.</p>
	</footer>

	<script src="config.js"></script>
	<script src="app.js"></script>
</body>
</html>
